server {
    listen 3000;
    server_name localhost;

    # Disable absolute redirects to prevent Nginx from adding internal port to redirects
    # when behind a reverse proxy (e.g. redirecting /star-trek to /star-trek/)
    absolute_redirect off;

    location /star-trek/ {
        alias /usr/share/nginx/html/star-trek/;
        index index.html;
        try_files $uri $uri/ /star-trek/index.html;
    }

    # Redirect /star-trek (no trailing slash) to /star-trek/
    location = /star-trek {
        return 301 /star-trek/;
    }

    # Health check or root access
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
